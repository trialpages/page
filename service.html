<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <!-- Sanal klavye açıldığında tarayıcının sayfayı kaydırmasını engelleyip, sadece içeriği yeniden boyutlandıran kritik meta etiketi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="theme-color" content="#09090b">
    <title>Customer Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-dark: #09090b;
            --bg-panel: #18181b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --msg-sent: #1e293b;
            --msg-received: #18181b;
            --border-color: rgba(255,255,255,0.08);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* Viewport'u tamamen kilitleyen Native App ayarları */
        html, body {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none; /* Sayfa sekmelerini engeller */
        }

        /* ----- LOGIN SCREEN (PREMIUM) ----- */
        #login-screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            background: #09090b;
            z-index: 100;
            overflow: hidden;
        }
        #login-screen::before {
            content: '';
            position: absolute;
            width: 520px; height: 520px;
            background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
            top: -220px; left: -140px;
            animation: float1 16s ease-in-out infinite;
            pointer-events: none;
        }
        #login-screen::after {
            content: '';
            position: absolute;
            width: 620px; height: 620px;
            background: radial-gradient(circle, rgba(99,102,241,0.14) 0%, transparent 70%);
            bottom: -260px; right: -180px;
            animation: float2 20s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, 40px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -40px); }
        }

        .premium-card {
            position: relative;
            z-index: 1;
            background: rgba(24, 24, 27, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 40px 28px 34px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
            max-width: 420px; width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .logo-wrap {
            width: 78px; height: 78px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(59,130,246,0.22), rgba(99,102,241,0.15));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 22px;
            border: 1px solid rgba(59,130,246,0.35);
            box-shadow: 0 0 50px rgba(59,130,246,0.28);
        }
        .logo-icon {
            font-size: 34px;
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(96,165,250,0.5));
        }

        #login-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.6px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .desc {
            color: #a1a1aa;
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.55;
        }

        .key-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 22px;
        }
        .key-box {
            flex: 1;
            max-width: 56px;
            height: 62px;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #f4f4f5;
            font-family: inherit;
            text-transform: uppercase;
            outline: none;
            transition: all 0.2s ease;
            caret-color: #3b82f6;
            padding: 0;
        }
        .key-box:focus {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.08);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
            transform: translateY(-2px);
        }
        .key-box.filled {
            border-color: rgba(59,130,246,0.5);
            background: rgba(59,130,246,0.06);
        }

        .premium-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(59,130,246,0.3);
            letter-spacing: 0.2px;
            font-family: inherit;
        }
        .premium-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59,130,246,0.42);
        }
        .premium-btn:active:not(:disabled) { transform: translateY(0); }
        .premium-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hint {
            font-size: 12px;
            color: #71717a;
            margin-top: 16px;
            letter-spacing: 0.1px;
        }

        .loader-ring {
            width: 46px; height: 46px;
            border: 3px solid rgba(59,130,246,0.15);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: #a1a1aa; }

        .waiting-pulse {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(59,130,246,0.15);
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .waiting-pulse::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(59,130,246,0.35);
            animation: pulse 2s ease-out infinite;
        }
        .waiting-pulse::after {
            content: '';
            width: 14px; height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 22px #3b82f6;
            position: relative;
            z-index: 1;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.1); opacity: 0; }
        }
        .waiting-text {
            font-size: 15px;
            color: #f4f4f5;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .key-display {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 24px;
        }
        .key-display span {
            color: #60a5fa;
            font-weight: 600;
            letter-spacing: 4px;
            font-size: 16px;
            margin-left: 4px;
        }
        .ghost-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #a1a1aa;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            transition: 0.2s;
        }
        .ghost-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #f4f4f5;
            border-color: rgba(255,255,255,0.2);
        }

        /* ----- CHAT SCREEN ----- */
        #chat-screen {
            position: absolute; inset: 0; /* Ekranı tam kaplar */
            display: none;
            flex-direction: column;
            width: 100%; height: 100%;
            overflow: hidden; /* Dışarı taşmayı engeller */
        }
        
        .header {
            flex-shrink: 0; /* Üst şeridin küçülmesini engeller */
            background: var(--bg-panel);
            padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            padding-top: max(15px, env(safe-area-inset-top));
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background-color: var(--accent); border-radius: 50%; border: 2px solid var(--bg-panel); }
        .details { display: flex; flex-direction: column; }
        .peer-name { font-weight: 600; font-size: 16px; }
        .typing-status { font-size: 12px; color: var(--accent); min-height: 15px; font-weight: 500; }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .header-actions button { background: transparent; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .header-actions button:hover { color: var(--accent); }
        .header-actions button.danger:hover { color: var(--danger); }

        /* Chat Area - Sadece bu alan kaydırılabilir (Scrollable) */
        .chat-area {
            flex: 1 1 auto; /* Kalan boşluğu doldurur */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* iOS için akıcı kaydırma */
            padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
            background: var(--bg-dark);
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }
        
        .message-row { display: flex; width: 100%; margin-bottom: 5px; position: relative; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }
        .message-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; position: relative; word-break: break-word; user-select: none; border: 1px solid var(--border-color); }
        .message-row.sent .message-bubble { background: var(--msg-sent); color: var(--text-main); border-bottom-right-radius: 4px; border-color: rgba(255,255,255,0.05); }
        .message-row.received .message-bubble { background: var(--msg-received); color: var(--text-main); border-bottom-left-radius: 4px; }
        
        .message-media img, .message-media video { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        .message-audio { width: 240px; max-width: 100%; height: 44px; margin-top: 5px; }
        .message-meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
        
        .read-receipt { font-size: 12px; }
        .receipt-sent { color: var(--text-muted); }
        .receipt-delivered { color: var(--text-main); }
        .receipt-read { color: var(--accent); } 

        .reactions-container { position: absolute; bottom: -12px; display: flex; gap: 4px; background: var(--bg-panel); padding: 4px 8px; border-radius: 16px; font-size: 13px; border: 1px solid var(--border-color); z-index: 2; }
        .message-row.sent .reactions-container { right: 10px; }
        .message-row.received .reactions-container { left: 10px; }

        /* Input Area - En altta sabit durur */
        .input-area {
            flex-shrink: 0;
            background: var(--bg-panel);
            padding: 12px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-color);
        }
        
        .input-row { display: flex; align-items: flex-end; gap: 10px; width: 100%; }
        .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 10px; border-radius: 50%; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
        
        .text-input-wrapper { flex: 1; background: rgba(255,255,255,0.05); border-radius: 24px; display: flex; align-items: center; padding: 5px 15px; border: 1px solid var(--border-color); }
        textarea { width: 100%; background: transparent; border: none; color: white; font-size: 15px; font-family: inherit; resize: none; max-height: 100px; padding: 10px 0; outline: none; }
        
        .send-btn-circle { background: var(--accent); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-size: 18px; transition: transform 0.2s; }
        .send-btn-circle:active { transform: scale(0.9); }

        /* Record UI */
        #record-ui { display: none; align-items: center; justify-content: space-between; width: 100%; background: rgba(239, 68, 68, 0.1); padding: 5px 15px; border-radius: 24px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .record-info { display: flex; align-items: center; gap: 10px; color: var(--danger); font-weight: 500; font-size: 15px; }
        @keyframes pulse-dot { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        .record-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; animation: pulse-dot 1s infinite; }

        /* FULLSCREEN CALL UI */
        #fullscreen-call { position: fixed; inset: 0; background: #000; z-index: 500; display: none; flex-direction: column; }
        .fs-main-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .fs-pip-video { position: absolute; bottom: 120px; right: 20px; width: 110px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; z-index: 2; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s ease; }
        
        .audio-call-bg { position: absolute; inset: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #18181b 0%, #09090b 100%); z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .audio-call-avatar { width: 120px; height: 120px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; box-shadow: 0 0 40px rgba(59, 130, 246, 0.2); }
        .audio-call-name { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        .audio-call-time { font-size: 16px; color: var(--text-muted); }

        .call-controls-overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 3; }
        .call-btn { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: none; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; transition: 0.2s; }
        .call-btn:active { transform: scale(0.9); }
        .call-btn.end { background: var(--danger); }

        /* INCOMING CALL MODAL */
        #incoming-call-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 600; display: none; align-items: center; justify-content: center; }
        .call-modal-content { background: var(--bg-panel); padding: 30px; border-radius: 24px; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border-color); }
        .ring-icon { font-size: 40px; color: var(--accent); margin-bottom: 20px; animation: ring 1s infinite ease-in-out; }
        @keyframes ring { 0% { transform: rotate(0); } 10% { transform: rotate(15deg); } 20% { transform: rotate(-15deg); } 30% { transform: rotate(15deg); } 40% { transform: rotate(-15deg); } 50% { transform: rotate(0); } 100% { transform: rotate(0); } }
        .call-modal-content h3 { margin-bottom: 30px; font-weight: 500; font-size: 18px; }
        .modal-actions { display: flex; justify-content: space-around; }
        .modal-btn { width: 60px; height: 60px; border-radius: 50%; border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .modal-btn.accept { background: var(--accent); }
        .modal-btn.decline { background: var(--danger); }
        .modal-btn:active { transform: scale(0.9); }

        /* Modals & Utils */
        #emoji-picker { position: fixed; display: none; background: var(--bg-panel); padding: 10px 15px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--border-color); gap: 15px; z-index: 300; }
        .emoji-option { font-size: 24px; cursor: pointer; transition: transform 0.2s; }
        .emoji-option:hover { transform: scale(1.3); }
        .system-message { text-align: center; font-size: 12px; color: var(--text-muted); margin: 10px 0; background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 12px; align-self: center; }
        
        #archive-modal { position: fixed; inset: 0; background: var(--bg-dark); z-index: 200; display: none; flex-direction: column; }
        .archive-header { flex-shrink: 0; padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding-top: max(20px, env(safe-area-inset-top)); }
        .archive-grid { flex: 1 1 auto; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .archive-item { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; cursor: pointer; background: #000; border: 1px solid var(--border-color); }

        #fs-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 400; display: none; justify-content: center; align-items: center; flex-direction: column; }
        #fs-content { max-width: 95%; max-height: 95%; object-fit: contain; }
        .close-fs { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; z-index: 401; }
        #file-input { display: none; }
        .file-loading { width: 100%; height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .file-progress { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN (PREMIUM KEY ENTRY) -->
    <div id="login-screen">
        <div class="premium-card">
            <div class="logo-wrap">
                <i class="fa-solid fa-shield-halved logo-icon"></i>
            </div>
            <h1 id="login-title">Customer Service</h1>
            <p class="desc">Enter the same 5-letter key on both devices to connect securely.</p>

            <div id="key-entry">
                <div class="key-inputs">
                    <input type="text" maxlength="1" class="key-box" data-index="0" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                    <input type="text" maxlength="1" class="key-box" data-index="1" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                    <input type="text" maxlength="1" class="key-box" data-index="2" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                    <input type="text" maxlength="1" class="key-box" data-index="3" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                    <input type="text" maxlength="1" class="key-box" data-index="4" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
                </div>
                <button class="premium-btn" id="connect-btn" onclick="submitKey()" disabled>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Connect
                </button>
                <p class="hint">Both users must enter the same key.</p>
            </div>

            <div id="loading-peer" style="display:none;">
                <div class="loader-ring"></div>
                <p class="loading-text">Connecting securely...</p>
            </div>

            <div id="host-panel" style="display:none;">
                <div class="waiting-pulse"></div>
                <p class="waiting-text">Waiting for the other user...</p>
                <p class="key-display">Key: <span id="display-key"></span></p>
                <button class="ghost-btn" onclick="cancelWaiting()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
        <div class="header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user"></i><div class="status-dot"></div></div>
                <div class="details">
                    <div class="peer-name">Guest</div>
                    <div class="typing-status" id="typing-indicator"></div>
                </div>
            </div>
            <div class="header-actions">
                <button onclick="openArchive()" title="Media Archive"><i class="fa-solid fa-images"></i></button>
                <button onclick="requestClearChat()" title="Clear"><i class="fa-solid fa-eraser"></i></button>
                <button onclick="startCall(false)" title="Audio"><i class="fa-solid fa-phone"></i></button>
                <button onclick="startCall(true)" title="Video"><i class="fa-solid fa-video"></i></button>
                <button onclick="logoutSession()" title="End Session" class="danger"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </div>

        <div class="chat-area" id="chat-area" translate="no">
            <div class="system-message" translate="no"><i class="fa-solid fa-lock" style="color:var(--accent);"></i> Fast and easy.</div>
        </div>

        <div class="input-area">
            <input type="file" id="file-input" onchange="handleFileSelect(event)">
            
            <div class="input-row" id="default-ui">
                <button class="action-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i></button>
                <div class="text-input-wrapper">
                    <!-- Odaklanıldığında native klavye davranışını iyileştirmek için event dinleyicisi eklendi -->
                    <textarea id="msg-input" translate="no" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="Message" rows="1" oninput="autoResize(this); handleTyping();" onkeydown="handleEnter(event)" onfocus="scrollToBottomDelay()"></textarea>
                </div>
                <button class="send-btn-circle" id="mic-btn" onclick="startRecording()"><i class="fa-solid fa-microphone"></i></button>
                <button class="send-btn-circle" id="send-btn" onclick="sendTextMessage()" style="display:none;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <div id="record-ui">
                <button class="action-btn" style="color:var(--danger);" onclick="cancelRecording()"><i class="fa-solid fa-trash-can"></i></button>
                <div class="record-info">
                    <div class="record-dot"></div>
                    <span id="record-time">00:00</span>
                </div>
                <button class="send-btn-circle" onclick="stopAndSendRecording()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- INCOMING CALL MODAL -->
    <div id="incoming-call-modal">
        <div class="call-modal-content">
            <i class="fa-solid fa-phone-volume ring-icon"></i>
            <h3 id="incoming-call-text">Incoming Video Call...</h3>
            <div class="modal-actions">
                <button class="modal-btn decline" onclick="declineCall()"><i class="fa-solid fa-phone-slash"></i></button>
                <button class="modal-btn accept" onclick="acceptCall()"><i class="fa-solid fa-phone"></i></button>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN CALL UI -->
    <div id="fullscreen-call">
        <div class="audio-call-bg" id="fs-audio-bg">
            <div class="audio-call-avatar"><i class="fa-solid fa-user"></i></div>
            <div class="audio-call-name">Guest</div>
            <div class="audio-call-time" id="fs-call-time">00:00</div>
        </div>
        <video id="video1" muted playsinline autoplay class="fs-pip-video" onclick="togglePiP()"></video>
        <video id="video2" playsinline autoplay class="fs-main-video" onclick="togglePiP()"></video>
        <div class="call-controls-overlay">
            <button class="call-btn" onclick="toggleAudioCallMute()" id="btn-mute"><i class="fa-solid fa-microphone"></i></button>
            <button class="call-btn" onclick="switchCamera()" id="btn-switch-cam"><i class="fa-solid fa-camera-rotate"></i></button>
            <button class="call-btn end" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <!-- EMOJI PICKER -->
    <div id="emoji-picker">
        <span class="emoji-option" onclick="sendReaction('💋')">💋</span>
        <span class="emoji-option" onclick="sendReaction('❤️')">❤️</span>
        <span class="emoji-option" onclick="sendReaction('😂')">😂</span>
        <span class="emoji-option" onclick="sendReaction('🥰')">🥰</span>
        <span class="emoji-option" onclick="sendReaction('😢')">😢</span>
    </div>

    <!-- MEDIA ARCHIVE MODAL -->
    <div id="archive-modal">
        <div class="archive-header">
            <h2 style="font-size: 18px; font-weight: 600;">Session Media</h2>
            <button class="action-btn" onclick="closeArchive()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="archive-grid" id="archive-grid"></div>
    </div>

    <!-- FULLSCREEN VIEWER -->
    <div id="fs-viewer">
        <i class="fa-solid fa-xmark close-fs" onclick="closeFsViewer()"></i>
        <div id="fs-container"></div>
    </div>

    <script>
        /** APP STATE **/
        let peer = null;
        let conn = null;
        let myPeerId = null;
        let messages = {};
        let sessionMedia = [];
        let typingTimeout = null;
        let isTabActive = true;
        let selectedMsgIdForReaction = null;
        let sessionTerminated = false;

        const CHUNK_SIZE = 64 * 1024;
        let incomingFiles = {};

        /** RECORDING STATE **/
        let mediaRecorder = null;
        let localAudioStream = null;
        let audioChunks = [];
        let isRecording = false;
        let recordTimerInterval = null;
        let recordSeconds = 0;

        /** CALL STATE **/
        let currentCall = null;
        let localCallStream = null;
        let callTimer = null;
        let callSeconds = 0;
        let isVideoCallActive = false;
        let pendingCall = null;
        let isLocalMainVideo = false; 
        let currentFacingMode = 'user';

        /** INITIALIZATION (KEY-BASED) **/
        window.addEventListener('load', () => {
            setupKeyInputs();
            setTimeout(() => {
                const first = document.querySelector('.key-box[data-index="0"]');
                if (first) first.focus();
            }, 200);
        });

        function setupKeyInputs() {
            const boxes = document.querySelectorAll('.key-box');
            boxes.forEach((box, i) => {
                box.addEventListener('input', (e) => {
                    let v = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
                    e.target.value = v.slice(-1);
                    box.classList.toggle('filled', !!box.value);
                    if (e.target.value && i < boxes.length - 1) {
                        boxes[i + 1].focus();
                    }
                    updateConnectBtn();
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && i > 0) {
                        boxes[i - 1].focus();
                        boxes[i - 1].value = '';
                        boxes[i - 1].classList.remove('filled');
                        updateConnectBtn();
                    }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        submitKey();
                    }
                });
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
                    const letters = text.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 5).split('');
                    letters.forEach((ch, idx) => {
                        if (boxes[idx]) { boxes[idx].value = ch; boxes[idx].classList.add('filled'); }
                    });
                    const lastIdx = Math.min(letters.length, 5) - 1;
                    if (lastIdx >= 0 && boxes[lastIdx]) boxes[lastIdx].focus();
                    updateConnectBtn();
                });
                box.addEventListener('focus', (e) => e.target.select());
            });
        }

        function getKey() {
            return Array.from(document.querySelectorAll('.key-box')).map(b => b.value).join('');
        }

        function updateConnectBtn() {
            const key = getKey();
            document.getElementById('connect-btn').disabled = key.length !== 5;
        }

        function submitKey() {
            const key = getKey();
            if (key.length !== 5) return;

            document.getElementById('key-entry').style.display = 'none';
            document.getElementById('loading-peer').style.display = 'block';
            document.getElementById('host-panel').style.display = 'none';
            document.getElementById('display-key').innerText = key;

            initPeerWithKey(key);
        }

        function initPeerWithKey(key) {
            const roomId = 'csroom' + key.toLowerCase();

            const hostPeer = new Peer(roomId, { debug: 1 });

            hostPeer.on('open', (id) => {
                // ID alındı -> biz "host"uz, karşı tarafı bekliyoruz
                peer = hostPeer;
                myPeerId = id;
                attachPeerHandlers(peer);
                document.getElementById('loading-peer').style.display = 'none';
                document.getElementById('host-panel').style.display = 'block';
                document.getElementById('display-key').innerText = key;
            });

            hostPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Bu key zaten biri tarafından alınmış -> "client" olarak bağlan
                    try { hostPeer.destroy(); } catch (e) {}
                    const clientPeer = new Peer({ debug: 1 });
                    clientPeer.on('open', (id) => {
                        peer = clientPeer;
                        myPeerId = id;
                        attachPeerHandlers(peer);
                        connectToPeer(roomId);
                    });
                    clientPeer.on('error', (err2) => {
                        console.error(err2);
                        alert("Connection error. Please try again.");
                        location.reload();
                    });
                } else {
                    console.error(err);
                }
            });
        }

        function attachPeerHandlers(p) {
            p.on('connection', (c) => {
                if (conn || sessionTerminated) { c.close(); return; }
                setupConnection(c);
            });

            p.on('call', (call) => {
                if(sessionTerminated) { call.close(); return; }
                pendingCall = call;
                const isVideo = call.metadata && call.metadata.isVideo;
                document.getElementById('incoming-call-text').innerText = isVideo ? "Incoming Video Call..." : "Incoming Audio Call...";
                document.getElementById('incoming-call-modal').style.display = 'flex';
            });
        }

        function cancelWaiting() {
            if(confirm("Cancel and start over?")) location.reload();
        }

        function connectToPeer(targetId) {
            const c = peer.connect(targetId, { reliable: true });
            setupConnection(c);
        }

        function setupConnection(c) {
            conn = c;
            conn.on('open', () => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                window.addEventListener('focus', () => { isTabActive = true; markAllAsRead(); });
                window.addEventListener('blur', () => { isTabActive = false; });
            });
            conn.on('data', handleIncomingData);
            conn.on('close', () => { 
                if(!sessionTerminated) { alert("Connection lost."); location.reload(); }
            });
        }

        /** DATA PROTOCOL **/
        function handleIncomingData(data) {
            if (data.type === 'typing') document.getElementById('typing-indicator').innerText = data.isTyping ? 'Typing...' : '';
            else if (data.type === 'receipt') {
                const msgEl = document.getElementById(`receipt-${data.msgId}`);
                if (msgEl) {
                    if (data.status === 'delivered') msgEl.innerHTML = '<i class="fa-solid fa-check-double receipt-delivered"></i>';
                    if (data.status === 'read') msgEl.innerHTML = '<i class="fa-solid fa-check-double receipt-read"></i>';
                }
            } 
            else if (data.type === 'reaction') addReactionToDOM(data.msgId, data.emoji);
            else if (data.type === 'clear-chat') executeClearChat();
            else if (data.type === 'logout') executeLogout();
            else if (data.type === 'file-start') {
                incomingFiles[data.fileId] = { meta: data.meta, chunks: new Array(data.meta.totalChunks), received: 0 };
                renderLoadingMessage(data.fileId, data.meta.msgType);
            } 
            else if (data.type === 'file-chunk') {
                const fileObj = incomingFiles[data.fileId];
                if (fileObj) {
                    fileObj.chunks[data.chunkIndex] = data.data;
                    fileObj.received++;
                    updateLoadingProgress(data.fileId, (fileObj.received / fileObj.meta.totalChunks) * 100);
                }
            } 
            else if (data.type === 'file-end') {
                const fileObj = incomingFiles[data.fileId];
                if (fileObj) {
                    const blob = new Blob(fileObj.chunks, { type: fileObj.meta.fileType });
                    const url = URL.createObjectURL(blob);
                    removeLoadingMessage(data.fileId);
                    const msg = { id: data.fileId, type: fileObj.meta.msgType, content: url, timestamp: getFormatedTime() };
                    renderMessage(msg, 'received');
                    sendReceipt(data.fileId, isTabActive ? 'read' : 'delivered');
                    if(msg.type === 'image' || msg.type === 'video') addToArchive(msg.type, url);
                    delete incomingFiles[data.fileId];
                }
            } 
            else if (data.type === 'text') {
                const msg = { id: data.id, type: 'text', content: data.content, timestamp: getFormatedTime() };
                renderMessage(msg, 'received');
                sendReceipt(data.id, isTabActive ? 'read' : 'delivered');
            }
        }

        /** MESSAGING **/
        function sendTextMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !conn) return;

            const msgId = generateId();
            conn.send({ type: 'text', id: msgId, content: text });
            renderMessage({ id: msgId, type: 'text', content: text, timestamp: getFormatedTime() }, 'sent');
            input.value = ''; input.style.height = 'auto'; toggleSendBtn();
            conn.send({ type: 'typing', isTyping: false });
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if(!file || !conn) return;
            let msgType = 'file';
            if (file.type.startsWith('image/')) msgType = 'image';
            else if (file.type.startsWith('video/')) msgType = 'video';
            await sendFileChunked(file, msgType);
            event.target.value = ''; 
        }

        async function sendFileChunked(file, msgType) {
            const fileId = generateId();
            const arrayBuffer = await file.arrayBuffer();
            const totalChunks = Math.ceil(arrayBuffer.byteLength / CHUNK_SIZE);
            const localUrl = URL.createObjectURL(file);
            
            renderMessage({ id: fileId, type: msgType, content: localUrl, timestamp: getFormatedTime() }, 'sent');
            if(msgType === 'image' || msgType === 'video') addToArchive(msgType, localUrl);

            conn.send({ type: 'file-start', fileId, meta: { name: file.name, size: file.size, fileType: file.type, totalChunks, msgType } });
            for (let i = 0; i < totalChunks; i++) {
                const chunk = arrayBuffer.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                conn.send({ type: 'file-chunk', fileId, chunkIndex: i, data: chunk });
            }
            conn.send({ type: 'file-end', fileId });
        }

        /** VOICE RECORDING **/
        function startRecording() {
            if(!conn || isRecording) return;
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                isRecording = true;
                localAudioStream = stream; 
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.addEventListener("dataavailable", e => audioChunks.push(e.data));
                mediaRecorder.start();
                
                document.getElementById('default-ui').style.display = 'none';
                document.getElementById('record-ui').style.display = 'flex';
                
                recordSeconds = 0;
                document.getElementById('record-time').innerText = "00:00";
                recordTimerInterval = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const s = String(recordSeconds % 60).padStart(2, '0');
                    document.getElementById('record-time').innerText = `${m}:${s}`;
                }, 1000);
            }).catch(err => alert("Microphone access denied."));
        }

        function stopAndSendRecording() {
            if(!isRecording) return;
            mediaRecorder.addEventListener("stop", () => {
                if(audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioFile = new File([audioBlob], "voice.webm", { type: 'audio/webm' });
                    sendFileChunked(audioFile, 'audio');
                }
                hardStopMicrophone();
            });
            mediaRecorder.stop();
            resetRecordUI();
        }

        function cancelRecording() {
            if(!isRecording) return;
            if(mediaRecorder.state !== "inactive") mediaRecorder.stop();
            hardStopMicrophone(); 
            resetRecordUI();
        }

        function hardStopMicrophone() {
            if(localAudioStream) { localAudioStream.getTracks().forEach(track => track.stop()); localAudioStream = null; }
            audioChunks = []; isRecording = false;
        }

        function resetRecordUI() {
            clearInterval(recordTimerInterval);
            document.getElementById('default-ui').style.display = 'flex';
            document.getElementById('record-ui').style.display = 'none';
        }

        /** CLEAR CHAT & LOGOUT **/
        function requestClearChat() {
            if(!conn) return;
            if(confirm("Clear chat for both users?")) {
                conn.send({ type: 'clear-chat' });
                executeClearChat();
            }
        }
        function executeClearChat() {
            document.getElementById('chat-area').innerHTML = '<div class="system-message" translate="no"><i class="fa-solid fa-lock" style="color:var(--accent);"></i> Messages and calls are end-to-end encrypted.</div>';
            messages = {}; sessionMedia = []; document.getElementById('archive-grid').innerHTML = '';
        }

        function logoutSession() {
            if(!conn) return;
            if(confirm("End session for both users? All messages will be deleted and the room will be permanently closed.")) {
                conn.send({ type: 'logout' });
                executeLogout();
            }
        }
        
        function executeLogout() {
            sessionTerminated = true;
            if(conn) { conn.close(); conn = null; }
            if(peer) { peer.destroy(); peer = null; }
            cleanupCall();
            hardStopMicrophone();
            
            window.history.replaceState({}, document.title, window.location.pathname);
            
            document.getElementById('chat-screen').innerHTML = `
                <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 20px;" translate="no">
                    <i class="fa-solid fa-power-off" style="font-size:50px; color:var(--danger); margin-bottom:20px;"></i>
                    <h2 style="font-size:22px; font-weight:600; margin-bottom:10px;">Session Terminated</h2>
                    <p style="color:var(--text-muted); font-size:15px; max-width:300px;">This P2P session has been permanently closed and all local data is cleared.</p>
                </div>
            `;
        }

        /** UI RENDERING & SCROLLING **/
        function renderMessage(msg, direction) {
            messages[msg.id] = { ...msg, direction, isRead: false };
            const chatArea = document.getElementById('chat-area');
            const row = document.createElement('div');
            row.className = `message-row ${direction}`; row.id = `row-${msg.id}`;

            let contentHtml = '';
            if(msg.type === 'text') {
                const safeText = document.createElement('div'); safeText.innerText = msg.content;
                contentHtml = safeText.innerHTML.replace(/\n/g, '<br>');
            } else if(msg.type === 'image') {
                contentHtml = `<div class="message-media" onclick="openFsViewer('${msg.content}', 'image')"><img src="${msg.content}"></div>`;
            } else if(msg.type === 'video') {
                contentHtml = `<div class="message-media" onclick="openFsViewer('${msg.content}', 'video')"><video src="${msg.content}" preload="metadata"></video></div>`;
            } else if(msg.type === 'audio') {
                contentHtml = `<audio class="message-audio" src="${msg.content}" controls></audio>`;
            }

            const receiptHtml = direction === 'sent' ? `<span class="read-receipt" id="receipt-${msg.id}"><i class="fa-solid fa-check receipt-sent"></i></span>` : '';
            row.innerHTML = `<div class="message-bubble" translate="no" oncontextmenu="showReactions(event, '${msg.id}')" onmousedown="startLongPress(event, '${msg.id}')" onmouseup="cancelLongPress()" ontouchstart="startLongPress(event, '${msg.id}')" ontouchend="cancelLongPress()">${contentHtml}<div class="message-meta"><span>${msg.timestamp}</span>${receiptHtml}</div><div class="reactions-container" id="reactions-${msg.id}" style="display:none;"></div></div>`;
            chatArea.appendChild(row); scrollToBottom();
        }

        function renderLoadingMessage(id, type) {
            const chatArea = document.getElementById('chat-area');
            const row = document.createElement('div'); row.className = `message-row received`; row.id = `load-${id}`;
            row.innerHTML = `<div class="message-bubble" translate="no"><div style="font-size:12px; color:var(--text-muted);"><i class="fa-solid fa-download"></i> Receiving ${type}...</div><div class="file-loading"><div class="file-progress" id="prog-${id}"></div></div></div>`;
            chatArea.appendChild(row); scrollToBottom();
        }
        function updateLoadingProgress(id, percent) { const el = document.getElementById(`prog-${id}`); if(el) el.style.width = percent + '%'; }
        function removeLoadingMessage(id) { const el = document.getElementById(`load-${id}`); if(el) el.remove(); }
        function handleTyping() { toggleSendBtn(); if(!conn) return; conn.send({ type: 'typing', isTyping: true }); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => conn.send({ type: 'typing', isTyping: false }), 2000); }
        function toggleSendBtn() { const val = document.getElementById('msg-input').value.trim(); document.getElementById('mic-btn').style.display = val ? 'none' : 'flex'; document.getElementById('send-btn').style.display = val ? 'flex' : 'none'; }
        function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px'; }
        function handleEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMessage(); } }
        
        function scrollToBottom() { const chat = document.getElementById('chat-area'); chat.scrollTop = chat.scrollHeight; }
        // Klavye açıldığında yumuşak bir şekilde aşağı kaydır
        function scrollToBottomDelay() { setTimeout(scrollToBottom, 300); }
        
        function sendReceipt(msgId, status) { if(conn) conn.send({ type: 'receipt', msgId, status }); }
        function markAllAsRead() { if(!conn) return; for(let id in messages) { if(messages[id].direction === 'received' && !messages[id].isRead) { messages[id].isRead = true; sendReceipt(id, 'read'); } } }

        /** REACTIONS **/
        let longPressTimer;
        function startLongPress(e, msgId) { longPressTimer = setTimeout(() => showReactions(e, msgId), 500); }
        function cancelLongPress() { clearTimeout(longPressTimer); }
        function showReactions(e, msgId) {
            e.preventDefault(); cancelLongPress(); selectedMsgIdForReaction = msgId;
            const picker = document.getElementById('emoji-picker'); picker.style.display = 'flex';
            let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
            if(x + 200 > window.innerWidth) x = window.innerWidth - 200; if(y - 60 < 0) y = 60;
            picker.style.left = x + 'px'; picker.style.top = (y - 50) + 'px';
        }
        document.addEventListener('click', (e) => { if(!e.target.closest('#emoji-picker') && !e.target.closest('.message-bubble')) document.getElementById('emoji-picker').style.display = 'none'; });
        function sendReaction(emoji) { document.getElementById('emoji-picker').style.display = 'none'; if(!selectedMsgIdForReaction || !conn) return; addReactionToDOM(selectedMsgIdForReaction, emoji); conn.send({ type: 'reaction', msgId: selectedMsgIdForReaction, emoji }); selectedMsgIdForReaction = null; }
        function addReactionToDOM(msgId, emoji) { const container = document.getElementById(`reactions-${msgId}`); if(container) { container.style.display = 'flex'; const span = document.createElement('span'); span.innerText = emoji; container.appendChild(span); } }

        /** FULLSCREEN CALL LOGIC **/
        function startCall(isVideo) {
            if(!conn) return;
            navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
                localCallStream = stream;
                const call = peer.call(conn.peer, stream, { metadata: { isVideo } });
                setupCallEvents(call, isVideo);
            }).catch(err => alert("Camera/Microphone access denied."));
        }

        function acceptCall() {
            if(!pendingCall) return;
            const isVideo = pendingCall.metadata && pendingCall.metadata.isVideo;
            document.getElementById('incoming-call-modal').style.display = 'none';
            
            navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true }).then((stream) => {
                localCallStream = stream;
                pendingCall.answer(stream);
                setupCallEvents(pendingCall, isVideo);
                pendingCall = null;
            }).catch(err => {
                alert("Permissions denied.");
                pendingCall.close();
                pendingCall = null;
            });
        }

        function declineCall() {
            if(pendingCall) { pendingCall.close(); pendingCall = null; }
            document.getElementById('incoming-call-modal').style.display = 'none';
        }

        function setupCallEvents(call, isVideo) {
            currentCall = call;
            isVideoCallActive = isVideo;
            
            const vidLocal = document.getElementById('video1');
            const vidRemote = document.getElementById('video2');
            
            vidLocal.srcObject = localCallStream;
            vidRemote.className = 'fs-main-video';
            vidLocal.className = 'fs-pip-video';
            isLocalMainVideo = false;

            document.getElementById('fullscreen-call').style.display = 'flex';
            
            if (isVideo) {
                document.getElementById('fs-audio-bg').style.display = 'none';
                document.getElementById('btn-switch-cam').style.display = 'flex';
                vidLocal.style.display = 'block';
                vidRemote.style.display = 'block';
            } else {
                document.getElementById('fs-audio-bg').style.display = 'flex';
                document.getElementById('btn-switch-cam').style.display = 'none';
                vidLocal.style.display = 'none';
                vidRemote.style.display = 'none'; 
            }
            
            startCallTimer();
            call.on('stream', (remoteStream) => { vidRemote.srcObject = remoteStream; });
            call.on('close', cleanupCall);
        }

        function togglePiP() {
            if(!isVideoCallActive) return;
            const vidLocal = document.getElementById('video1');
            const vidRemote = document.getElementById('video2');
            
            if(isLocalMainVideo) {
                vidRemote.className = 'fs-main-video';
                vidLocal.className = 'fs-pip-video';
            } else {
                vidRemote.className = 'fs-pip-video';
                vidLocal.className = 'fs-main-video';
            }
            isLocalMainVideo = !isLocalMainVideo;
        }

        function startCallTimer() {
            callSeconds = 0; document.getElementById('fs-call-time').innerText = "00:00";
            callTimer = setInterval(() => {
                callSeconds++;
                const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const s = String(callSeconds % 60).padStart(2, '0');
                document.getElementById('fs-call-time').innerText = `${m}:${s}`;
            }, 1000);
        }

        function toggleAudioCallMute() {
            if(localCallStream && localCallStream.getAudioTracks().length > 0) {
                const track = localCallStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                const btn = document.getElementById('btn-mute');
                btn.innerHTML = track.enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
                btn.style.color = track.enabled ? 'white' : 'var(--danger)';
            }
        }

        async function switchCamera() {
            if (!localCallStream || !isVideoCallActive) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                const newVideoTrack = newStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);

                const oldTrack = localCallStream.getVideoTracks()[0];
                if(oldTrack) { oldTrack.stop(); localCallStream.removeTrack(oldTrack); }
                localCallStream.addTrack(newVideoTrack);
                
                document.getElementById('video1').srcObject = new MediaStream([newVideoTrack, localCallStream.getAudioTracks()[0]]);
            } catch (err) { console.error("Camera switch failed:", err); }
        }

        function endCall() { if(currentCall) currentCall.close(); cleanupCall(); }

        function cleanupCall() {
            if(localCallStream) { localCallStream.getTracks().forEach(track => track.stop()); localCallStream = null; }
            clearInterval(callTimer);
            document.getElementById('fullscreen-call').style.display = 'none';
            document.getElementById('video1').srcObject = null;
            document.getElementById('video2').srcObject = null;
            isVideoCallActive = false; currentCall = null;
        }

        /** MEDIA ARCHIVE & FS VIEWER **/
        function addToArchive(type, url) {
            sessionMedia.push({ type, url });
            const grid = document.getElementById('archive-grid');
            let elHtml = type === 'image' ? `<img src="${url}" class="archive-item" onclick="openFsViewer('${url}', 'image')">` : `<video src="${url}" class="archive-item" onclick="openFsViewer('${url}', 'video')" preload="metadata"></video>`;
            grid.insertAdjacentHTML('beforeend', elHtml);
        }
        function openArchive() { document.getElementById('archive-modal').style.display = 'flex'; }
        function closeArchive() { document.getElementById('archive-modal').style.display = 'none'; }
        function openFsViewer(src, type) {
            const container = document.getElementById('fs-container');
            container.innerHTML = type === 'image' ? `<img id="fs-content" src="${src}">` : `<video id="fs-content" src="${src}" controls autoplay playsinline></video>`;
            document.getElementById('fs-viewer').style.display = 'flex';
        }
        function closeFsViewer() {
            document.getElementById('fs-container').innerHTML = ''; 
            document.getElementById('fs-viewer').style.display = 'none';
        }

        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function getFormatedTime() { return new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }
    </script>
</body>
</html>
